# Conda environment for the project.
#   conda env create -f env.yaml
#   conda activate rl-privacy-leakage
#
# Needs an NVIDIA GPU for reasonable speed (tested on a Colab T4 with Qwen3-1.7B).
name: rl-privacy-leakage
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.4
      - transformers>=4.56
      - peft>=0.15
      - accelerate>=1.0
      - pandas>=2.0
      - matplotlib>=3.8
      # Iteration 2 (GRPO):
      - trl>=0.19
      - datasets>=3.0
# Note: if peft raises "incompatible version of torchao", uninstall torchao
# (pip uninstall -y torchao); this project doesn't use it.
